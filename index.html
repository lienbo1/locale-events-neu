<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#185f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lokale Events">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Lokale Veranstaltungen</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#17202d;--muted:#667085;--accent:#185f91;--soft:#e8f2f8;--border:#dde4ec}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:760px;margin:auto;padding:16px 14px 40px}
.hero{text-align:center;padding:8px 4px 12px}
.hero img{width:82px;height:82px;border-radius:20px;box-shadow:0 8px 20px rgba(20,70,110,.16)}
h1{font-size:27px;margin:8px 0 3px}
.sub{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 8px 22px rgba(30,50,70,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:540px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:700;margin:7px 0 5px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--border);border-radius:12px;background:white;color:var(--text)}
button{font:inherit;font-weight:750;border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
.primary{width:100%;background:var(--accent);color:white;margin-top:12px}
.ghost{background:white;border:1px solid var(--border);color:var(--text)}
.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}
.periods button{padding:10px 7px;background:white;border:1px solid var(--border);font-size:13px}
.periods button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:480px){.periods{grid-template-columns:1fr 1fr}}
.status{background:var(--soft);color:var(--accent);padding:12px;border-radius:12px;margin-top:12px}
.error{background:#fff2dc;color:#794c00}
.hidden{display:none}
.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)}
.event{padding:15px 0;border-top:1px solid var(--border)}
.event:first-of-type{border-top:0}
.event h2{font-size:18px;margin:0 0 6px}
.meta{font-size:14px;color:var(--muted);line-height:1.55}
.badge{display:inline-block;margin-top:7px;background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:750}
.event a{display:inline-block;margin-top:9px;text-decoration:none;background:var(--accent);color:white;padding:8px 10px;border-radius:10px;font-size:14px;font-weight:700}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:12px}
.places{margin-top:8px;font-size:13px;color:var(--muted)}
.tip{margin-top:12px;padding:11px 12px;border-radius:12px;background:#f7f9fc;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
<section class="hero">
<img src="/icon-192.png" alt="App-Symbol Lokale Veranstaltungen">
<h1>Lokale Veranstaltungen</h1>
<p class="sub">Flohmärkte, Märkte, Feste, Kirmes & öffentliche Events aus lokalen Hinweisen.</p>
</section>

<section class="card">
<div class="grid">
<div>
<label for="plz">Postleitzahl</label>
<input id="plz" inputmode="numeric" maxlength="5" placeholder="z. B. 45768">
</div>
<div>
<label for="radius">Umkreis</label>
<select id="radius">
<option value="5">5 km</option>
<option value="10">10 km</option>
<option value="25">25 km</option>
<option value="50" selected>50 km</option>
<option value="75">75 km</option>
<option value="100">100 km</option>
</select>
</div>
</div>

<label>Zeitraum</label>
<div class="periods" id="periods">
<button type="button" data-period="today">Heute</button>
<button type="button" data-period="weekend">Dieses Wochenende</button>
<button type="button" data-period="7days">Nächste 7 Tage</button>
<button type="button" data-period="all" class="active">Alle</button>
</div>

<div>
<label for="cat">Kategorie</label>
<select id="cat">
<option value="">Alle lokalen Events</option>
<option>Flohmarkt</option>
<option>Markt</option>
<option>Stadtfest</option>
<option>Kirmes</option>
<option>Schützenfest</option>
<option>Familie</option>
<option>Verein</option>
<option>Shopping</option>
<option>Veranstaltung</option>
</select>
</div>

<button id="search" class="primary">🔎 Lokale Veranstaltungen suchen</button>

<div class="tip">
Es werden nur zukünftige erkannte Termine angezeigt. Pro Seite erscheinen 10 Treffer.
</div>

<div id="status" class="status hidden" aria-live="polite"></div>
</section>

<section id="results" class="card hidden">
<div class="head">
<strong id="headline">Veranstaltungen</strong>
<span id="count" class="small"></span>
</div>

<div id="places" class="places"></div>
<div id="list"></div>

<div class="pager">
<button id="prev" class="ghost">← Zurück</button>
<span id="page">Seite 1</span>
<button id="next" class="ghost">Weiter →</button>
</div>

<p id="note" class="note"></p>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let page=0,totalPages=1,last={},period="all",hasNext=false,hasPrev=false;

document.querySelectorAll("#periods button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("#periods button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    period=btn.dataset.period;
  });
});

function status(msg,err=false){
  $("status").textContent=msg;
  $("status").className="status"+(err?" error":"");
}

function clearStatus(){
  $("status").classList.add("hidden");
}

function fmtDate(s){
  if(!s)return null;
  return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{
    weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"
  });
}

function fmtPub(s){
  if(!s)return "";
  const d=new Date(s);
  return isNaN(d)?"":d.toLocaleDateString("de-DE");
}

function esc(s){
  return String(s||"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

async function load(useLast=false){
  if(!useLast){
    const plz=$("plz").value.trim();

    if(!/^\d{5}$/.test(plz)){
      status("Bitte eine gültige fünfstellige PLZ eingeben.",true);
      return;
    }

    last={
      plz,
      radius:$("radius").value,
      category:$("cat").value,
      period
    };

    page=0;
  }

  status("Durchsuche lokale Veranstaltungshinweise …");

  try{
    const q=new URLSearchParams({...last,page:String(page)});
    const r=await fetch("/api/events?"+q);
    const data=await r.json();

    if(!r.ok){
      throw new Error(data.error||"Suche fehlgeschlagen.");
    }

    page=Number(data.page||0);
    totalPages=Number(data.totalPages||1);
    hasPrev=typeof data.hasPrev==="boolean" ? data.hasPrev : page>0;
    hasNext=typeof data.hasNext==="boolean" ? data.hasNext : page+1<totalPages;

    $("results").classList.remove("hidden");
    $("headline").textContent="Events rund um "+data.center.name;
    $("count").textContent=data.total+" gefundene Hinweise";
    $("places").textContent="Einbezogene Orte: "+(data.searchedPlaces||[]).join(", ");
    $("page").textContent="Seite "+(page+1)+" von "+totalPages;
    $("prev").disabled=!hasPrev;
    $("next").disabled=!hasNext;
    $("note").textContent=data.note||"";

    $("list").innerHTML=data.events.length
      ? data.events.map(e=>`
        <article class="event">
          <h2>${esc(e.title)}</h2>
          <div class="meta">
            ${e.eventDate?"📅 Termin: "+esc(fmtDate(e.eventDate))+"<br>":""}
            📍 Bezug: ${esc(e.matchedPlace)}<br>
            📰 Quelle: ${esc(e.source)}${e.published?" · veröffentlicht "+esc(fmtPub(e.published)):""}
          </div>
          <span class="badge">${esc(e.category)}</span><br>
          <a href="${esc(e.url)}" target="_blank" rel="noopener">Originalquelle öffnen</a>
        </article>
      `).join("")
      : '<p class="note">Keine passenden zukünftigen Veranstaltungshinweise gefunden. Versuche „Alle“, einen größeren Umkreis oder eine andere Kategorie.</p>';

    clearStatus();

  }catch(e){
    status(e.message,true);
  }
}

$("search").addEventListener("click",()=>load(false));

$("prev").addEventListener("click",()=>{
  if(!hasPrev) return;
  page=Math.max(0,page-1);
  load(true);
});

$("next").addEventListener("click",()=>{
  if(!hasNext) return;
  page=page+1;
  load(true);
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
</script>
</body>
</html>
